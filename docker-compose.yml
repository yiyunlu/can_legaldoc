services:
  postgres:
    image: postgres:16-alpine
    container_name: canlii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: canlii
      POSTGRES_USER: canlii
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canlii_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - canlii-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canlii -d canlii"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PLAYWRIGHT: "true"    # set "false" to skip Chromium (~800MB smaller)
    container_name: canlii-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://canlii:${POSTGRES_PASSWORD:-canlii_dev_pass}@postgres:5432/canlii
    volumes:
      - ./checkpoint.db:/app/checkpoint.db
      - ./data:/app/data
      - ./config.json:/app/config.json
    networks:
      - canlii-net
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: canlii-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - canlii-net
    depends_on:
      - app

networks:
  canlii-net:
    driver: bridge

volumes:
  pgdata:
